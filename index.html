<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey Webhook Control</title>
    <style>
        :root {
            --primary: #5865f2;
            --secondary: #3ba55c;
            --danger: #ed4245;
            --dark: #0e0e0e;
            --darker: #0a0a0a;
            --light: #f0f0f0;
            --border: #2e2e2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            background: rgba(15,15,15,0.8);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(88,101,242,0.3);
        }
        header h1 span { color: var(--danger); }
        .header-stats { display: flex; gap: 15px; font-size: 0.85rem; color: #999; }
        .stat { background: var(--border); padding: 5px 12px; border-radius: 20px; }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab {
            background: var(--border);
            border: none;
            color: #ccc;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover { background: #2a2a2a; }
        .tab.active {
            background: linear-gradient(135deg, var(--primary), #7289da);
            color: white;
        }
        .tab.danger.active { background: linear-gradient(135deg, var(--danger), #c73a3d); }
        .tab.success.active { background: linear-gradient(135deg, var(--secondary), #4caf50); }

        .panel {
            display: none;
            background: rgba(15,15,15,0.9);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .panel.active { display: block; }
        .panel h2 {
            margin-bottom: 18px;
            font-size: 1.3rem;
            color: var(--primary);
        }
        .panel.danger h2 { color: var(--danger); }
        .panel.success h2 { color: var(--secondary); }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 500;
        }
        .form-group input, .form-group textarea
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #181818;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Consolas', monospace;
        }
        .form-group input[type="color"] { width: auto; height: 40px; }
        .form-group input[type="checkbox"] { width: auto; cursor: pointer; margin-right: 10px; }
        .form-group label[for*="check"] { display: inline; font-weight: normal; }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }
        .form-row .form-group { margin-bottom: 0; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #7289da);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #c73a3d);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, var(--secondary), #4caf50);
            color: white;
        }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .hook-list {
            display: grid;
            gap: 12px;
        }
        .hook-card {
            background: #181818;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hook-info { flex: 1; min-width: 200px; }
        .hook-name {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hook-url {
            font-size: 0.75rem;
            color: #888;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hook-actions { display: flex; gap: 8px; }
        .hook-actions .btn { padding: 8px 14px; font-size: 0.8rem; }

        .log-container {
            background: #181818;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: var(--secondary); }
